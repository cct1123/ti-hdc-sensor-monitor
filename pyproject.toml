[project]
name = "ti-hdc-sensor-monitor"
version = "0.1.0"
description = "Local HDC3020EVM temperature and humidity dashboard over USB2ANY HID"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["dash>=2.18,<4"]

[project.optional-dependencies]
usb = ["hidapi>=0.15,<1"]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
